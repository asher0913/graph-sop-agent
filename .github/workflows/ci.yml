name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q
      - name: Evaluation reproduces the committed results
        run: |
          sop-agent evaluate --out /tmp/evaluation.json > /dev/null
          sop-agent evolve --out /tmp/evolution.json > /dev/null
          python -c "import json; assert json.load(open('/tmp/evaluation.json')) == json.load(open('results/evaluation.json')); assert json.load(open('/tmp/evolution.json')) == json.load(open('results/evolution.json')); print('reproduced')"
